        function forcePlay() {
            if (isPlaying) return;

            // Разблокировка AudioContext (обход для Safari и Chrome)
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
            }

            audio.play().then(() => {
                isPlaying = true;
                screen.style.display = 'none'; // Убираем текст при успешном запуске
                removeListeners();

                // Если браузер всё ещё блокирует, ждём малейшего движения
            });
