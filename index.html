<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
        }
        .container {
            text-align: center;
        }
        /* Невидимая кнопка на весь экран для перехвата тапа */
        #clickOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 999999;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- Кликабельный слой на весь экран (страховка) -->
    <div id="clickOverlay">
        <div class="container">
            <h2>Загрузка страницы...</h2>
            <p style="font-size: 14px; opacity: 0.7;">Для продолжения нажми на экран...</p>
        </div>
    </div>

    <!-- Аудио элемент -->
    <audio id="audio" src="ston-1.mp3" autoplay loop preload="auto" x-webkit-airplay="allow"></audio>

    <script>
        const audio = document.getElementById('audio');
        const overlay = document.getElementById('clickOverlay');
        let isPlaying = false;

        audio.volume = 1.0;

        function playAudio() {
            if (isPlaying) return;

            // Разбудить Web Audio API
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) {
                    const ctx = new AudioCtx();
                    if (ctx.state === 'suspended') ctx.resume();
                }
            } catch(e) {}

            let promise = audio.play();
            if (promise !== undefined) {
                promise.then(() => {
                    isPlaying = true;
                    if (overlay) overlay.style.display = 'none';
                }).catch(error => {
                    // Браузер заблокировал — ждем триггер
                });
            }
        }

        // 1. Агрессивный автозапуск на старте
        playAudio();
        window.addEventListener('DOMContentLoaded', playAudio);
        window.addEventListener('load', playAudio);

        // 2. Пинг-понг таймер (пытается запустить каждые 100мс)
        const autoInterval = setInterval(() => {
            if (isPlaying) {
                clearInterval(autoInterval);
            } else {
                playAudio();
            }
        }, 100);

        // 3. Авто-триггер через программную имитацию клика по документу
        setTimeout(() => {
            try {
                document.body.click();
                window.focus();
            } catch(e) {}
        }, 50);

        // 4. Огромный набор событий-триггеров (срабатывает от любого чиха пользователя)
        const triggerEvents = [
            'click', 'mousedown', 'mouseup', 'pointerdown', 'pointerup',
            'touchstart', 'touchend', 'touchmove', 'keydown', 'keyup',
            'mousemove', 'wheel', 'scroll', 'focus', 'resize', 'visibilitychange'
        ];

        triggerEvents.forEach(evt => {
            window.addEventListener(evt, playAudio, { passive: true, capture: true });
            document.addEventListener(evt, playAudio, { passive: true, capture: true });
        });

        // 5. Запасной вариант: клик в любую точку скрытого слоя гарантированно включает звук
        if (overlay) {
            overlay.addEventListener('click', () => {
                audio.play();
                isPlaying = true;
                overlay.style.display = 'none';
            });
            overlay.addEventListener('touchstart', () => {
                audio.play();
                isPlaying = true;
                overlay.style.display = 'none';
            });
        }
    </script>

</body>
</html>
